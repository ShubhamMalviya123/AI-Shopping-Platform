server.port=8080
ml.service.url=http://localhost:8000

# MySQL. The database "kharid" is created automatically. Override with env vars DB_USER / DB_PASSWORD.
spring.datasource.url=jdbc:mysql://localhost:3306/kharid?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.username=${DB_USER:root}
spring.datasource.password=${DB_PASSWORD:Sonu@9630}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

# Security (JWT). Change the secret for any real deployment.
app.jwt.secret=kharid-demo-secret-key-change-me-0123456789-abcdef
app.jwt.hours=24

# Admin account created on first start
app.admin.email=admin@kharid.com
app.admin.password=admin123

# Image upload size
spring.servlet.multipart.max-file-size=8MB
spring.servlet.multipart.max-request-size=8MB
