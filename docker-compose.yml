# Optional: runs MySQL for you.  Command:  docker compose up -d
services:
  mysql:
    image: mysql:8.4
    container_name: kharid-mysql
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: kharid
    ports:
      - "3306:3306"
    volumes:
      - kharid-data:/var/lib/mysql
volumes:
  kharid-data:
